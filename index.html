
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testimonios Motivacionales</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-white p-3">
    <div class="container my-4">
        <h1 class="display-5 fw-bold text-center mb-4">
            Testimonios de nuestros estudiantes
        </h1>

        <div class="row g-4">
            <div class="col-12 col-md-6">
                <figure class="p-3 bg-light border-start border-4
                               border-primary rounded h-100">
                    <blockquote class="blockquote">
                        <p class="fs-5 fw-medium mb-2">
                            "Gracias a la metodología Mobile First pude
                            lanzar mi primera aplicación web en menos
                            de tres meses."
                        </p>
                    </blockquote>

                    <figcaption class="blockquote-footer mt-1 mb-0">
                        Mariana Silva en
                        <cite title="Tech Startups">Tech Startups</cite>
                    </figcaption>
                </figure>
            </div>
            <div class="col-12 col-md-6">
                <figure class="p-3 bg-light border-start border-4
                               border-success rounded h-100">
                    <blockquote class="blockquote">
                        <p class="fs-5 fw-medium mb-2">
                            "Aprender a usar los tres métodos de conexión
                            me dio la flexibilidad que necesitaba
                            para mis clientes."
                        </p>
                    </blockquote>

                    <figcaption class="blockquote-footer mt-1 mb-0">
                        David López en
                        <cite title="DevStudio">DevStudio</cite>
                    </figcaption>
                </figure>
            </div>

        </div>
    </div>
</body>
</html>
